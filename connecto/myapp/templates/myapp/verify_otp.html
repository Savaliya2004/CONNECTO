{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Connecto</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'myapp/css/login.css' %}?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <a href="/" class="logo-text-new">
                <!-- <span class="logo-icon-new">⚡</span> -->
                <span class="logo-label-new">CONNECTO</span>
            </a>
        </div>
        <p class="subtitle login-subtitle">Enter the OTP sent to your email.</p>

        {% if e_msg %}
        <div class="login-error" style="margin-top: 10px;">{{ e_msg }}</div>
        {% endif %}

        <div id="otp-timer-container" class="timer-wrapper">
            <span class="timer-label">Code expires in:</span>
            <span id="timer" class="timer-countdown">30</span>
            <span class="timer-unit">s</span>
        </div>

        <form method="post" action="{% url 'reset_password' %}" class="login-form" id="otp-form">
            {% csrf_token %}

            <div class="form-group login-form-group">
                <input type="hidden" name="email" value="{{ email }}" placeholder="email@example.com" required
                    class="login-input">
            </div>


            <div class="form-group login-form-group">
                <label class="login-label">OTP</label>
                <input type="number" name="otp" id="otp-input" placeholder="123456" required class="login-input">
            </div>

            <button type="submit" id="verify-btn" class="btn-pill btn-primary login-btn-submit">Verify</button>
        </form>

        <p class="login-footer">
            <a href="{% url 'forgot_password' %}" id="resend-link" class="login-link disabled-link">Resend OTP</a>
        </p>
    </div>

    <style>
        .timer-wrapper {
            margin-bottom: 1.5rem;
            padding: 0.8rem;
            background: #FAF6F0;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
            border: 1px solid #E8E0D4;
        }

        .timer-label {
            font-size: 0.85rem;
            color: #8A7E70;
            font-weight: 500;
        }

        .timer-countdown {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2D4A2E;
            min-width: 25px;
        }

        .timer-unit {
            font-size: 0.85rem;
            color: #8A7E70;
            font-weight: 500;
        }

        .timer-expired {
            color: #B91C1C !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .disabled-link {
            pointer-events: none;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-input:disabled {
            background-color: #f5f5f5 !important;
            cursor: not-allowed;
        }

        .login-btn-submit:disabled {
            background-color: #8A7E70 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let timeLeft = 30;
            const timerDisplay = document.getElementById('timer');
            const verifyBtn = document.getElementById('verify-btn');
            const otpInput = document.getElementById('otp-input');
            const resendLink = document.getElementById('resend-link');
            const timerWrapper = document.getElementById('otp-timer-container');

            const countdown = setInterval(function () {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 10) {
                    timerDisplay.classList.add('timer-expired');
                }

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "0";

                    // Disable input and verify button
                    otpInput.disabled = true;
                    verifyBtn.disabled = true;

                    // Enable resend link
                    resendLink.classList.remove('disabled-link');

                    // Update label
                    document.querySelector('.timer-label').textContent = "OTP Expired";
                    document.querySelector('.timer-unit').style.display = 'none';
                }
            }, 1000);
        });
    </script>
</body>

</html>
