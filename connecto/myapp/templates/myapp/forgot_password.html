{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Connecto</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'myapp/css/login.css' %}?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <a href="/" class="logo-text-new">
                <!-- <span class="logo-icon-new">⚡</span> -->
                <span class="logo-label-new">CONNECTO</span>
            </a>
        </div>
        <p class="subtitle login-subtitle">Reset your password.</p>

        {% if e_msg %}
        <div class="login-error">{{ e_msg }}</div>
        {% endif %}

        <form method="post" action="{% url 'forgot_password' %}" class="login-form">
            {% csrf_token %}
            <div class="form-group login-form-group">
                <label class="login-label">Email Address</label>
                <input type="email" name="email" placeholder="email@example.com" required class="login-input"
                    value="{{email}}">
            </div>

            <button type="submit" class="btn-pill btn-primary login-btn-submit">Send OTP</button>
        </form>

        <p class="login-footer">
            Remembered your password? <a href="{% url 'login' %}" class="login-link">Sign In</a>
        </p>
    </div>
</body>

</html>
