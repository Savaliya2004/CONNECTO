{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Connecto</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'myapp/css/login.css' %}?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <h1 class="logo-text login-logo">Connecto</h1>
        <p class="subtitle login-subtitle">Create a new password.</p>

        {% if e_msg %}
            <div class="login-error">{{ e_msg }}</div>
        {% endif %}

        <form method="post" action="{% url 'reset_password' %}" class="login-form">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group login-form-group">
                <label class="login-label">New Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="login-input">
            </div>
            
            <div class="form-group login-form-group">
                <label class="login-label">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="••••••••" required class="login-input">
            </div>
            
            <button type="submit" class="btn-pill btn-primary login-btn-submit">Update Password</button>
        </form>
    </div>
</body>
</html>
