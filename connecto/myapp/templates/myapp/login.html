{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Connecto</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'myapp/css/login.css' %}?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* Dark Theme Overrides for Login Page */
        [data-theme="dark"] body {
            background: linear-gradient(145deg, #0a0e0a 0%, #0d120d 50%, #121812 100%) !important;
            color: var(--text-body) !important;
        }

        [data-theme="dark"] .login-card {
            background: var(--bg-card) !important;
            border-color: var(--border-color) !important;
            box-shadow: var(--shadow) !important;
        }

        [data-theme="dark"] .login-logo {
            color: var(--text-primary) !important;
            -webkit-text-fill-color: var(--text-primary) !important;
        }

        [data-theme="dark"] .login-subtitle {
            color: var(--text-muted) !important;
        }

        [data-theme="dark"] .login-label {
            color: var(--text-body) !important;
        }

        [data-theme="dark"] .login-input {
            background: var(--bg-main) !important;
            border-color: var(--border-color) !important;
            color: var(--text-primary) !important;
        }

        [data-theme="dark"] .login-input::placeholder {
            color: var(--text-muted) !important;
        }

        [data-theme="dark"] .login-link {
            color: var(--accent-secondary) !important;
        }

        [data-theme="dark"] .login-footer {
            color: var(--text-muted) !important;
        }
    </style>
</head>

<body>
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode"
        style="position: fixed; top: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: var(--shadow); z-index: 1000; transition: var(--transition);">
        🌙
    </button>

    <div class="login-card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <a href="/" class="logo-text-new">
                <!-- <span class="logo-icon-new">⚡</span> -->
                <span class="logo-label-new">CONNECTO</span>
            </a>
        </div>
        <p class="subtitle login-subtitle">Experience luxury connectivity.</p>

        {% if e_msg %}
        <div class="login-error">{{ e_msg }}</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="login-form">
            {% csrf_token %}
            <div class="form-group login-form-group">
                <label class="login-label">Email Address</label>
                <input type="email" name="email" placeholder="email@example.com" required class="login-input">
            </div>
            <div class="form-group login-form-group">
                <label class="login-label">Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="login-input">
            </div>
            <div style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
                <a href="{% url 'forgot_password' %}" class="login-link" style="font-size: 0.85rem;">Forgot
                    Password?</a>
            </div>
            <button type="submit" class="btn-pill btn-primary login-btn-submit">Sign In</button>
        </form>

        <p class="login-footer">
            Don't have an account? <a href="{% url 'signup' %}" class="login-link">Join Now</a>
        </p>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
    </script>
</body>

</html>
