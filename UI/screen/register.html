<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - Chillr</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

<div class="bg-blur"></div>

<div class="register-container">

    <!-- LEFT SIDE -->
    <div class="register-left">
        <h1>Join Chillr </h1>
        <p>Create your account & start chilling with friends</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="register-right">
        <div class="register-card">

            <h2>Create Account</h2>
            <p class="sub-text">It’s quick and easy</p>

            <form>

                <div class="row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create password">
                    </div>

                    <div class="form-group">
                        <label>Confirm</label>
                        <input type="password" placeholder="Confirm password">
                    </div>
                </div>

                <button class="register-btn">Create Account</button>

            </form>

            <div class="divider">OR</div>

            <button class="google-btn">Sign up with Google</button>

            <p class="bottom-text">
                Already have an account? <a href="login.html">Login</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
